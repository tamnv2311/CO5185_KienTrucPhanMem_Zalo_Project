services:
  mysql-user:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: zalolite
      MYSQL_DATABASE: user_db
    volumes: ["zalolite_user_mysql:/var/lib/mysql"]
  mysql-group:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: zalolite
      MYSQL_DATABASE: group_db
    volumes: ["zalolite_group_mysql:/var/lib/mysql"]
  mysql-stats:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: zalolite
      MYSQL_DATABASE: stats_db
    volumes: ["zalolite_stats_mysql:/var/lib/mysql"]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
  mongo:
    image: mongo:7
  redis:
    image: redis:7-alpine
  gateway:
    build: services/api-gateway
    ports: ["8080:8080"]
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://statistics-service:8085
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: statistics-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/stats/**
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://user-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: user-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/auth/**,/api/users/**
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://group-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: group-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/groups/**,/api/friends/**
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://chat-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: chat-service
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/api/chat/**,/ws/**
    depends_on: [user-service, group-service, chat-service, statistics-service]
  user-service:
    build: services/user-service
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-user:3306/user_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: zalolite
      JWT_SECRET: zalolite-development-secret-at-least-32-bytes-long
    depends_on: [mysql-user]
  group-service:
    build: services/group-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-group:3306/group_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: zalolite
    depends_on: [mysql-group]
  chat-service:
    build: services/chat-service
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/chat_db
      SPRING_DATA_REDIS_HOST: redis
      GROUP_SERVICE_URL: http://group-service:8082
      JWT_SECRET: zalolite-development-secret-at-least-32-bytes-long
    depends_on: [mongo, redis, group-service]
  statistics-service:
    build: services/statistics-service
    ports: ["8085:8085"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-stats:3306/stats_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: zalolite
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on: [mysql-stats, rabbitmq]
  frontend:
    build: frontend
    ports: ["80:80"]
    depends_on: [gateway]
volumes:
  zalolite_user_mysql:
  zalolite_group_mysql:
  zalolite_stats_mysql:
