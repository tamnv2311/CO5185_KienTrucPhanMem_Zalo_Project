server:
  port: 8085

spring:
  application:
    name: statistics-service
  datasource:
    url: jdbc:h2:mem:statsdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    listener:
      simple:
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    rabbit:
      enabled: false
