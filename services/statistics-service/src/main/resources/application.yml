server:
  port: 8085

spring:
  datasource:
    url: jdbc:h2:mem:statsdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5672

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    rabbit:
      enabled: false
