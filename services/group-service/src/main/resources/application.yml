server:
  port: 8082
spring:
  application:
    name: group-service
  datasource:
    url: jdbc:h2:mem:groupdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
group:
  max-members: 200
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    rabbit:
      enabled: false
