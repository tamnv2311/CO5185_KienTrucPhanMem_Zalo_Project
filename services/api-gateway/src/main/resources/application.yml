server:
  port: 8080
jwt:
  secret: "zalolite-development-secret-at-least-32-bytes-long"
spring:
  cloud:
    gateway:
      routes:
        - id: statistics-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/stats/**
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: group-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/groups/**,/api/friends/**
        - id: chat-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/chat/**,/ws/**
