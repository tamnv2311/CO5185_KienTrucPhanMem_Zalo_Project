server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:zalolite-development-secret-at-least-32-bytes-long}
gateway:
  rate-limit:
    # Max requests per minute and per client IP on /api/auth/** (brute-force protection).
    auth-per-minute: ${AUTH_RATE_LIMIT:60}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          "[/**]":
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/friends/**
        - id: group-service
          uri: ${GROUP_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/groups/**
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/chat/**,/ws/**
        - id: media-service
          uri: ${MEDIA_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/media/**
        - id: statistics-service
          uri: ${STATISTICS_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/stats/**
management:
  endpoints:
    web:
      exposure:
        include: health
