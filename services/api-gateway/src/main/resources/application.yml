server:
  port: 8080
jwt:
  secret: "zalolite-development-secret-at-least-32-bytes-long"
spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates: [Path=/api/auth/**,/api/users/**]
        - id: group-service
          uri: http://group-service:8082
          predicates: [Path=/api/groups/**,/api/friends/**]
        - id: chat-service
          uri: http://chat-service:8083
          predicates: [Path=/api/chat/**,/ws/**]
