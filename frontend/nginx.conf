server {
    listen 80;
    root /usr/share/nginx/html;
    # Uploads go through nginx -> gateway -> media-service (videos up to 100 MB).
    client_max_body_size 110m;

    # Look the gateway up through Docker's DNS at request time, not once at startup: nginx then starts
    # even while the gateway is still booting, and keeps working after the gateway is recreated.
    resolver 127.0.0.11 valid=10s;
    set $gateway http://gateway:8080;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # The entry page must always be revalidated so a new build is picked up on reload;
    # the hashed files under /assets can be cached for good.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }
    location /ws {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
